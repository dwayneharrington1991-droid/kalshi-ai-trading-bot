name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (no credentials — live tests are skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Editable install also verifies that packaging (pyproject.toml) works.
      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"

      # No API keys are configured in CI. Tests marked `live` are skipped
      # automatically (tests/conftest.py) — a plain pytest run never touches
      # the real Kalshi API or places orders.
      - name: Run test suite
        # A per-test timeout turns a hung test into a named failure with a
        # thread dump instead of a silently cancelled job.
        run: |
          # Resource trace: a GitHub runner that runs out of memory is shut down
          # without a pytest summary. This prints memory and the largest
          # processes every 20 s so a leak is attributable to the tests running.
          ( while sleep 20; do echo "::group::resources $(date -u +%T)"; free -m | sed -n 2,3p;             echo "python procs: $(pgrep -c -f python || true)"; ps -eo pid,ppid,rss,etimes,args --sort=-rss | head -12 | cut -c1-200;             echo "::endgroup::"; done ) &
          pytest -v -rfE --timeout=300 --durations=40

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
